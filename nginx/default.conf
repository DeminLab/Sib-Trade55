events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream nextjs {
    server app:3000;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name sib-trade55.ru www.sib-trade55.ru;

    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sib-trade55.ru www.sib-trade55.ru;

    ssl_certificate /etc/letsencrypt/live/sib-trade55.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sib-trade55.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    client_max_body_size 20m;

    location = /api/custom-requests {
      client_max_body_size 52m;
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /_next/static/ {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      proxy_pass http://nextjs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
    }
  }

  server {
    listen 80;
    listen [::]:80;
    server_name dev.sib-trade55.ru;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
      return 301 https://sib-trade55.ru/admin;
    }
  }
}
